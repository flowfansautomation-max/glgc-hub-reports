<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLGC Hub Reports — Outreach</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css?v=18">
  <script src="config.js?v=18"></script><script src="roster.js?v=18"></script><script src="data.js?v=18"></script>
</head>
<body>
  <div class="wrap">
    <div class="top"><div class="nav">
      <a href="index.html">Weekly Summary</a>
      <a href="hub.html">Per Hub</a>
      <a href="outreach.html" class="active">Outreach</a>
      <a href="trends.html">Trends</a>
      <a href="defaulters.html">Defaulters</a>
    </div></div>
    <div class="title">Outreach</div>
    <div class="sub">Souls won, by governor</div>
    <div class="controls"><label>Weekend<select id="week"></select></label></div>
    <div id="status"></div>

    <div class="kpis" id="kpis"></div>

    <div class="section-label">🌍 Souls won by governor</div>
    <div class="chartscroll"><div class="chartinner wide xwide" style="height:420px"><canvas id="c2"></canvas></div></div>

    <div class="chartscroll"><table id="gtbl" class="ppt">
      <thead><tr><th class="num">#</th><th>Governor</th><th>Hub Center(s)</th><th class="num">Souls Won</th></tr></thead>
      <tbody></tbody><tfoot></tfoot>
    </table></div>

    <div class="section-label">⛪ Souls won by service</div>
    <div class="chartscroll"><table id="stbl" class="ppt small">
      <thead><tr><th>Service</th><th class="num">Souls Won</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>

<script>
var chart;
GLGC.load(function (M) {
  GLGC.banner(M);
  var sel = document.getElementById('week');
  if (!M.weeks.length) { document.getElementById('status').innerHTML = '<div class="empty">No reports submitted yet.</div>'; return; }
  sel.innerHTML = '<option value="all">All weekends so far</option>' +
    M.weeks.slice().reverse().map(function (w) { return '<option value="'+w.key+'">WK '+w.wk+' · '+w.label+'</option>'; }).join('');
  sel.value = String(M.weeks[M.weeks.length - 1].key);
  sel.onchange = render; render();

  function render() {
    var keys = sel.value === 'all' ? M.weeks.map(function (w) { return w.key; }) : [+sel.value];
    function souls(g) { return keys.reduce(function (s, k) { return s + M.govSouls(k, g); }, 0); }
    var total = keys.reduce(function (s, k) { return s + M.soulsTotal(k); }, 0);
    var sv = {}; keys.forEach(function (k) { var x = M.serviceSouls(k); Object.keys(x).forEach(function (n) { sv[n] = (sv[n] || 0) + x[n]; }); });
    var rows = M.governors.map(function (g) { return { g:g, n:souls(g.name) }; });
    var winners = rows.filter(function (x) { return x.n; }).length, ng = rows.length;
    var top = rows.slice().sort(function (a, b) { return b.n - a.n; })[0];

    var kp = [
      { lab:'Souls won', val:GLGC.fmt(total), note:'names submitted on the outreach form', c:'var(--red)' },
      { lab:'Governors who won souls', val:winners+' / '+ng, note:'submitted at least one soul', c:'var(--green)' },
      { lab:'Top governor', val:top && top.n ? top.n : '—', note:top && top.n ? rows.filter(function (x) { return x.n === top.n; }).map(function (x) { return x.g.name; }).join(' & ') : 'no souls yet', c:'var(--gold)' }
    ];
    document.getElementById('kpis').innerHTML = kp.map(function (x) {
      return '<div class="kpi" style="--kc:'+x.c+'"><div class="lab">'+x.lab+'</div><div class="val">'+x.val+'</div><div class="note">'+x.note+'</div></div>'; }).join('');

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('c2'), { type:'bar', plugins:[GLGC.valueLabels],
      data:{ labels:rows.map(function (x) { return x.g.name; }),
             datasets:[{ label:'Souls won', data:rows.map(function (x) { return x.n; }), backgroundColor:'#e2574c', borderRadius:4, maxBarThickness:36 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} },
        scales:{ x:{ ticks:{color:'#ddd',font:{size:12},maxRotation:55,minRotation:0,autoSkip:false}, grid:{color:'#1a1a1a'} },
                 y:{ beginAtZero:true, grace:'14%', ticks:{color:'#ddd',precision:0}, grid:{color:'#1e1e1e'} } } } });

    var ranked = rows.slice().sort(function (a, b) { return b.n - a.n; });
    document.querySelector('#gtbl tbody').innerHTML = ranked.map(function (x, i) {
      return '<tr><td class="rank">'+(i+1)+'</td><td class="gname">'+x.g.name+'</td><td class="hubs">'+(x.g.hubs.join(', ') || '—')+'</td><td class="num'+(x.n ? '' : ' zero')+'">'+x.n+'</td></tr>'; }).join('');
    document.querySelector('#gtbl tfoot').innerHTML = '<tr><td colspan="3"><b>Total souls won</b></td><td class="num">'+GLGC.fmt(total)+'</td></tr>';

    var S = window.SERVICES || [], names = S.concat(Object.keys(sv).filter(function (x) { return S.indexOf(x) === -1; }));
    document.querySelector('#stbl tbody').innerHTML = names.map(function (nm) {
      var v = sv[nm] || 0; return '<tr><td class="gname">'+nm+'</td><td class="num'+(v ? '' : ' zero')+'">'+v+'</td></tr>'; }).join('');
  }
}, GLGC.fail);
</script>
</body>
</html>
